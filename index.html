<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マインドタイプ診断｜ADHD・ASD・心の声・心のイメージ</title>
<meta name="description" content="ADHDタイプ診断、ASD傾向チェック、心の声チェック、心のイメージ診断。心理的な違いをセルフチェックできるサイト。回答はブラウザの外に送信されません。">
<style>
  :root{
    --ink:#232733; --sub:#6b7280; --bg:#f6f5f1; --card:#ffffff;
    --accent:#5b5bd6; --accent2:#0ea5a4; --warn:#e0653a; --pink:#d6578a;
    --border:#e6e2d8; --chip:#eef0ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
       background:var(--bg); color:var(--ink); line-height:1.7;}
  .wrap{max-width:680px; margin:0 auto; padding:20px 16px 64px;}
  header.site{text-align:center; padding:28px 0 6px;}
  header.site .logo{font-size:15px; letter-spacing:.18em; color:var(--accent); font-weight:700;}
  header.site h1{font-size:30px; margin:6px 0 4px; letter-spacing:.02em;}
  header.site p{color:var(--sub); font-size:14px; margin:0;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:18px;
        padding:26px 22px; margin-top:20px; box-shadow:0 2px 10px rgba(35,39,51,.04);}
  .hidden{display:none !important;}
  /* hub */
  .mod-grid{display:grid; gap:14px; margin-top:20px;}
  .mod{display:block; width:100%; text-align:left; cursor:pointer; background:var(--card);
       border:1.5px solid var(--border); border-radius:18px; padding:20px; box-shadow:0 2px 10px rgba(35,39,51,.04);}
  .mod:active{transform:scale(.995);}
  .mod .m-tag{font-size:11.5px; letter-spacing:.14em; font-weight:800; color:var(--accent);}
  .mod.teal .m-tag{color:var(--accent2);} .mod.orange .m-tag{color:var(--warn);} .mod.pink .m-tag{color:var(--pink);}
  .mod h2{font-size:21px; margin:4px 0 4px;}
  .mod p{margin:0; font-size:14px; color:var(--sub);}
  .mod .m-meta{margin-top:10px; font-size:12.5px; color:var(--sub); display:flex; gap:14px;}
  .mod .m-meta b{color:var(--ink);}
  .note{font-size:12.5px; color:var(--sub); background:#fbfaf7; border:1px dashed var(--border);
        border-radius:12px; padding:12px 14px; margin-top:18px;}
  button.cta{display:block; width:100%; border:none; cursor:pointer; background:var(--accent); color:#fff;
             font-size:18px; font-weight:700; padding:16px; border-radius:14px; margin-top:22px;}
  button.ghost{display:block; width:100%; border:1px solid var(--border); background:#fff; color:var(--ink);
               cursor:pointer; font-size:15px; padding:13px; border-radius:12px; margin-top:10px;}
  /* intro */
  .intro-points{display:grid; gap:10px; margin:18px 0;}
  .intro-points div{background:#faf9ff; border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:15px;}
  .intro-points b{color:var(--accent);}
  /* quiz */
  .progress-row{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--sub); margin-top:22px;}
  .progress{height:10px; background:#e9e6dd; border-radius:99px; overflow:hidden; margin-top:8px;}
  .progress > div{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width .25s;}
  .chip{display:inline-block; background:var(--chip); color:var(--accent); font-size:12.5px; font-weight:700;
        padding:4px 12px; border-radius:99px; margin-top:20px;}
  .q-text{font-size:21px; font-weight:700; line-height:1.55; margin:14px 0 6px; min-height:66px;}
  .q-sub{font-size:13px; color:var(--sub); margin-bottom:14px;}
  .opts{display:grid; gap:10px;}
  .opt{border:1.5px solid var(--border); background:#fff; border-radius:14px; padding:15px 16px;
       font-size:16.5px; text-align:left; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .opt small{color:var(--sub); font-size:12px;}
  .opt.sel{border-color:var(--accent); background:#f2f2ff; font-weight:700;}
  .nav-row{display:flex; gap:10px; margin-top:18px;}
  .nav-row button{flex:1; border:1px solid var(--border); background:#fff; border-radius:12px; padding:12px; font-size:15px; cursor:pointer;}
  .nav-row button:disabled{opacity:.35;}
  /* result */
  .verdict{text-align:center; padding:8px 0 2px;}
  .verdict .label{font-size:13px; letter-spacing:.14em; color:var(--sub); font-weight:700;}
  .big-percent{font-size:84px; font-weight:800; line-height:1.05; color:var(--accent); margin:2px 0;}
  .big-percent span{font-size:34px;}
  .verdict-word{font-size:21px; font-weight:800; margin:4px 0 2px;}
  .type-box{margin-top:18px; background:linear-gradient(135deg,#f2f2ff,#ecfdfa); border:1px solid var(--border);
            border-radius:16px; padding:20px; text-align:center;}
  .type-box .t-label{font-size:12.5px; letter-spacing:.16em; color:var(--accent2); font-weight:800;}
  .type-box .t-name{font-size:27px; font-weight:800; margin:4px 0 2px;}
  .type-box .t-en{font-size:12px; letter-spacing:.22em; color:var(--sub); font-weight:700;}
  .type-box p{font-size:14.5px; text-align:left; margin:12px 0 0;}
  h3.sec{font-size:16.5px; margin:26px 0 10px; display:flex; align-items:center; gap:8px;}
  h3.sec::before{content:""; width:9px; height:9px; border-radius:3px; background:var(--accent2); display:inline-block;}
  .bar-row{margin:12px 0;}
  .bar-row .b-head{display:flex; justify-content:space-between; font-size:14.5px; font-weight:700;}
  .bar-row .b-head span:last-child{color:var(--accent);}
  .bar{height:14px; background:#eceae2; border-radius:99px; overflow:hidden; margin-top:5px;}
  .bar > div{height:100%; border-radius:99px; background:var(--accent);}
  .bar.teal > div{background:var(--accent2);}
  .bar.orange > div{background:var(--warn);}
  .bar.pink > div{background:var(--pink);}
  .bar-desc{font-size:13px; color:var(--sub); margin-top:4px;}
  ul.tight{margin:6px 0 0; padding-left:20px;}
  ul.tight li{margin:7px 0; font-size:15px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:560px){ .two-col{grid-template-columns:1fr;} .big-percent{font-size:68px;} }
  .mini-card{background:#faf9ff; border:1px solid var(--border); border-radius:14px; padding:14px 16px;}
  .mini-card h4{margin:0 0 6px; font-size:14.5px; color:var(--accent);}
  .mini-card p{margin:0; font-size:14px;}
  .disclaimer{font-size:12px; color:var(--sub); margin-top:26px; border-top:1px solid var(--border); padding-top:14px;}
  footer.site{text-align:center; color:var(--sub); font-size:12px; margin-top:34px;}
  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .card{box-shadow:none; border:none; padding:0;}
    #result-screen{display:block !important;}
    #hub-screen,#intro-screen,#quiz-screen{display:none !important;}
    .wrap{max-width:100%; padding:0;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="logo">MIND TYPE LAB</div>
    <h1>マインドタイプ診断</h1>
    <p>人によって違う「心のクセ」をチェックする場所</p>
  </header>

  <!-- ===== Hub ===== -->
  <section id="hub-screen">
    <div class="mod-grid" id="mod-grid"></div>
    <div class="note">※ どの診断もセルフチェックです。医学的な診断ではありません。結果は傾向の目安としてお楽しみください。回答データはブラウザの外に送信されません。</div>
  </section>

  <!-- ===== Intro ===== -->
  <section id="intro-screen" class="hidden">
    <div class="card">
      <span class="chip" id="i-tag"></span>
      <h2 id="i-title" style="margin:12px 0 6px; font-size:24px;"></h2>
      <p id="i-desc" style="margin:0;"></p>
      <div class="intro-points" id="i-points"></div>
      <p style="font-size:14px; color:var(--sub);" id="i-meta"></p>
      <button class="cta" id="start-btn">診断をはじめる</button>
      <button class="ghost" id="intro-back">← 診断一覧にもどる</button>
      <div class="note" id="i-note"></div>
    </div>
  </section>

  <!-- ===== Quiz ===== -->
  <section id="quiz-screen" class="hidden">
    <div class="progress-row"><span id="q-count"></span><span id="q-pct"></span></div>
    <div class="progress"><div id="q-bar"></div></div>
    <div class="card" style="margin-top:16px;">
      <span class="chip" id="q-chip"></span>
      <div class="q-text" id="q-text"></div>
      <div class="q-sub" id="q-sub"></div>
      <div class="opts" id="q-opts"></div>
      <div class="nav-row">
        <button id="back-btn">← もどる</button>
        <button id="skip-btn">スキップ →</button>
      </div>
    </div>
  </section>

  <!-- ===== Result ===== -->
  <section id="result-screen" class="hidden">
    <div class="card" id="result-body"></div>
  </section>

  <footer class="site">Mind Type Lab ― 回答はあなたのブラウザ内でのみ処理されます</footer>
</div>
<script>

const $ = (id) => document.getElementById(id);

const FREQ_SUB = "普段の自分に、どのくらい当てはまりますか？";

function barRow(label, pct, numText, colorClass, desc){
  return `<div class="bar-row"><div class="b-head"><span>${label}</span><span>${numText}</span></div>` +
    `<div class="bar ${colorClass}"><div style="width:${pct}%"></div></div>` +
    (desc ? `<div class="bar-desc">${desc}</div>` : "") + `</div>`;
}
function blurPct(rawPct, bonus){
  let p = Math.round(5 + rawPct * 1.02) + (bonus || 0);
  return Math.max(5, Math.min(97, p));
}
function resultShell(o){
  return `
  <div class="verdict">
    <div class="label">${o.label}</div>
    <div class="big-percent">${o.percent}<span>％</span></div>
    <div class="verdict-word">${o.verdict}</div>
    <div style="font-size:14px; color:var(--sub);">${o.verdictSub}</div>

  <div class="type-box">
    <div class="t-label">YOUR TYPE</div>
    <div class="t-name">${o.typeName}</div>
    <div class="t-en">${o.typeEn}</div>
    <p>${o.typeDesc}</p>
  </div>
  ${o.bodyHtml}
  <div class="no-print">
    <button class="cta" onclick="window.print()">結果をPDFで保存する</button>
    <button class="ghost" onclick="retryModule()">もう一度診断する</button>

function adhdSymptom(answers, offset){
  let count = 0; const detail = [];
  for (let s = 0; s < 9; s++){
    const v1 = answers[offset + s*2] ?? 0, v2 = answers[offset + s*2 + 1] ?? 0;
    const present = Math.max(v1, v2) >= 3 || (v1 >= 2 && v2 >= 2);
    if (present) count++;
    detail.push({ key: ADHD_Q[offset + s*2][1], score: v1 + v2 });
  }
  return { count, detail };
}
function levelText(pct){ if (pct >= 65) return "かなり強く出ています"; if (pct >= 45) return "はっきり出ています"; if (pct >= 28) return "やや出ています"; return "ほとんど出ていません"; }
function renderADHD(ans){
  const sum = (f, t) => ans.slice(f, t).reduce((a, b) => a + (b ?? 0), 0);
  const aSum = sum(0, 18), bSum = sum(18, 36), cSum = sum(36, 50);
  const aPct = Math.round(aSum / 72 * 100), bPct = Math.round(bSum / 72 * 100), cPct = Math.round(cSum / 56 * 100);
  const symA = adhdSymptom(ans, 0), symB = adhdSymptom(ans, 18);
  let bonus = 0;
  if (symA.count >= 5 || symB.count >= 5) bonus += 5;
  if (symA.count >= 5 && symB.count >= 5) bonus += 3;
  if (cPct >= 60) bonus += 4;
  if ((ans[36] ?? 0) >= 3) bonus += 3;
  const possibility = blurPct(0.42 * aPct + 0.33 * bPct + 0.25 * cPct, bonus);
  let verdict, vsub;
  if (possibility >= 70){ verdict = "ADHDの傾向が強いタイプです"; vsub = "少なくとも一方の領域で、診断基準の症状数（成人では5つ以上）に届く回答パターンでした。"; }
  else if (possibility >= 50){ verdict = "ADHDの傾向が見られます"; vsub = "いくつかの症状が日常的に出ている回答パターンでした。困りごとの程度によっては、専門家への相談も選択肢です。"; }
  else if (possibility >= 32){ verdict = "軽いADHD傾向が見られます"; vsub = "一部の項目に傾向が出ています。特性というより、場面や体調で出やすいタイプかもしれません。"; }
  else { verdict = "ADHDの傾向は弱いタイプです"; vsub = "今回の回答では、ADHDらしいパターンはほとんど見られませんでした。"; }
  const aHigh = symA.count >= 5 || aPct >= 60, bHigh = symB.count >= 5 || bPct >= 60;
  const aMid = aPct >= 35, bMid = bPct >= 35;
  let tk;
  if (aHigh && bHigh) tk = "chaos"; else if (aHigh) tk = "dreamer"; else if (bHigh) tk = "accel";
  else if (aMid || bMid) tk = "switcher"; else if (cPct >= 40) tk = "sensitive"; else tk = "steady";
  const type = ADHD_TYPES[tk];
  const sorted = [...symA.detail.map(d => ({...d, area:"不注意"})), ...symB.detail.map(d => ({...d, area:"多動・衝動"}))].sort((x, y) => y.score - x.score);
  let picks = sorted.filter(d => d.score >= 3).slice(0, 5); let relative = false;
  if (!picks.length){ picks = sorted.filter(d => d.score > 0).slice(0, 3); relative = picks.length > 0; }
  const renderSym = (d) => { const [label, desc] = ADHD_SYMPTOMS[d.key]; return `<li><b>${label}</b>（${d.area}） ― ${desc}</li>`; };
  let points;
  if (picks.length && relative) points = "<li>突出して高い項目はありませんでした。強いて言えば、相対的にこのあたりが「っぽい」ポイントです。</li>" + picks.map(renderSym).join("");
  else if (picks.length) points = picks.map(renderSym).join("");
  else points = "<li>全項目がほぼゼロでした。ここまで徹底すると、それはそれで一種の才能かもしれません。</li>";
  const strengths = [];
  if ((ans[36] ?? 0) >= 2) strengths.push("興味のあることへの<b>過集中</b> ― 没頭したときの生産性と深さは大きな武器です。");
  if ((ans[47] ?? 0) >= 2) strengths.push("<b>集中力の瞬発力</b> ― ハマったときの吸収と推進は、場面によって強く発揮されます。");
  if (bPct >= 40) strengths.push("<b>行動量とエネルギー</b> ― 思いついてから動くまでの速さは強みになります。");
  if (aPct < 40) strengths.push("<b>注意の安定性</b> ― 日常の細部管理が比較的安定しているのは土台としての強みです。");
  strengths.push("<b>パターンの自覚</b> ― 自分の出方を知っていること自体が、環境設計と対策の出発点になります。");
  const body = `
    <h3 class="sec">領域別スコア</h3>
    ${barRow("不注意", aPct, `${aSum}点（${aPct}%）／ 症状 ${symA.count}/9`, "", `不注意の出方は「${levelText(aPct)}」。成人の診断基準では、この領域の症状が5つ以上・6か月以上続くことが一つの目安です（あなたは${symA.count}つ）。`)}
    ${barRow("多動性・衝動性", bPct, `${bSum}点（${bPct}%）／ 症状 ${symB.count}/9`, "teal", `多動性・衝動性の出方は「${levelText(bPct)}」。同じく症状数の目安は5つ以上です（あなたは${symB.count}つ）。`)}
    ${barRow("生活への影響", cPct, `${cSum}点（${cPct}%）`, "orange", cPct >= 50 ? "傾向が生活の困りごとに結びついている度合いが高めです。" : cPct >= 28 ? "傾向が困りごとに結びつく場面が、ある程度ありそうです。" : "傾向があっても、生活への支障としては小さめのようです。")}
    <h3 class="sec">あなたの「ADHDっぽい」ポイント</h3>
    <ul class="tight">${points}</ul>
    <h3 class="sec">強みとして出やすい面</h3>
    <ul class="tight">${strengths.slice(0, 4).map(s => `<li>${s}</li>`).join("")}</ul>
    <h3 class="sec">タイプ別の付き合い方ヒント</h3>
    <div class="two-col">${type.tips.map(([h, p]) => `<div class="mini-card"><h4>${h}</h4><p>${p}</p></div>`).join("")}</div>`;
  return { label: "ADHD傾向の可能性", percent: possibility, verdict, verdictSub: vsub,
           typeName: type.name, typeEn: type.en, typeDesc: type.desc, bodyHtml: body, disclaimer: DISCLAIMER_COMMON };
}

    <ul class="tight">
      <li>「考えるとき頭の中で声が聞こえるかどうか」は、人によって大きく違うことが研究で分かってきています。声がよく聞こえる人もいれば、まったく聞こえない人もいます。</li>
      <li>どちらが優れているという話ではなく、思考の「形式」の違いです。声派は言語化とリハーサルが得意で、無声派はイメージや概念で一気に処理するのが得意な傾向があります。</li>
      <li>相手に「頭の中で考えて」と言っても、相手の頭の中の形式は自分と違うかもしれません。それを知ると、すれ違いの見え方が変わります。</li>
    </ul>`;
  return { label: "心の声の聞こえ度", percent: pct, verdict, verdictSub: "12問の回答から算出した、内的な声の鮮明さの目安です。",
           typeName: type.name, typeEn: type.en, typeDesc: type.desc, bodyHtml: body,
           disclaimer: "この結果はセルフチェックによる傾向の目安です。心の声の有無は病気や障害ではなく、認知の個人差として研究されているテーマです。" };
}

/* ================= 心のイメージモジュール ================= */
const IMAGE_Q = [
  "赤いリンゴ","家族や親しい人の顔","よく行く場所の風景","朝日が昇る空の色",
  "好きな食べ物の見た目と質感","自分の部屋の間取りと家具の配置","動物が走っている動き","雨の日の窓の様子",
  "数字の「7」の形","海の波の動き","子どもの頃の教室","まだ行ったことのない場所の想像"
];
function renderImage(ans){
  const total = ans.reduce((a, b) => a + (b ?? 0), 0);
  const pct = Math.max(2, Math.min(98, Math.round(total / 48 * 100)));
  const sub = (idxs, max) => Math.round(idxs.reduce((a, i) => a + (ans[i] ?? 0), 0) / max * 100);
  let type, verdict;
  if (pct >= 75){ type = {name:"ハイパーフォト型",en:"THE PHOTOGRAPHIC",desc:"心の中のイメージが写真のように鮮明なタイプ。思い出すことと「見直す」ことの差が小さく、視覚的な記憶や再現が大きな武器になります。鮮明すぎて、嫌な場面も同じ解像度で再生されやすいのが玉にきずです。"}; verdict = "イメージが写真のように鮮明なタイプです"; }
  else if (pct >= 50){ type = {name:"クリア型",en:"THE CLEAR VIEWER",desc:"心のイメージがかなり鮮明なタイプ。人の顔や場所を思い浮かべて考えることが自然にでき、視覚化を使った記憶や計画が得意なスタイルです。"}; verdict = "イメージが鮮明なタイプです"; }
  else if (pct >= 25){ type = {name:"ミスト型",en:"THE MISTY",desc:"イメージは浮かぶものの、霧がかかったようにぼんやりしているタイプ。輪郭は分かるが細部は曖昧、という人が多く、言葉や概念で補いながら考えるスタイルです。"}; verdict = "イメージはぼんやりめのタイプです"; }
  else { type = {name:"ブラインド型",en:"THE BLIND MIND",desc:"心の目でイメージをほとんど描けないタイプ。研究では「アファンタジア（aphantasia）」と呼ばれ、人口の数%に見られると報告されています。顔や風景を「思い浮かべる」のではなく「知っている」で処理するスタイルで、言語や概念の思考が発達しやすいと言われます。欠陥ではなく、認知の形式の違いです。"}; verdict = "イメージがほぼ浮かばないタイプです"; }
  const body = `
    <h3 class="sec">対象別の鮮明度</h3>
    ${barRow("人と顔", sub([1], 4), sub([1], 4) + "%", "", "")}
    ${barRow("場所と風景", sub([2,5,10], 12), sub([2,5,10], 12) + "%", "teal", "")}
    ${barRow("物と質感", sub([0,4,8], 12), sub([0,4,8], 12) + "%", "orange", "")}
    ${barRow("動きと自然", sub([3,6,7,9,11], 20), sub([3,6,7,9,11], 20) + "%", "pink", "")}
    <h3 class="sec">この違いについて</h3>
    <ul class="tight">
      <li>「リンゴを思い浮かべて」と言われたとき、頭の中に見える鮮明さは人によって全く違います。写真のように見える人から、何も見えない人までいます。</li>
      <li>イメージが浮かばない人も、物の形や位置は「知識として」把握しています。見え方の違いは、記憶力や知能の優劣とは別物です。</li>
      <li>「昨日の夕食を思い出して」と言われて映像が再生されるかどうかは、この個人差が大きく関係します。</li>
    </ul>`;
  return { label: "心のイメージ鮮明度", percent: pct, verdict, verdictSub: "12問の回答から算出した、心の目の鮮明さの目安です。",
           typeName: type.name, typeEn: type.en, typeDesc: type.desc, bodyHtml: body,
           disclaimer: "この結果はセルフチェックによる傾向の目安です。イメージの鮮明さは病気や障害ではなく、認知の個人差として研究されているテーマです。" };
}

    options:[["まったくない",0],["まれにある",1],["時々ある",2],["よくある",3],["いつもある",4]],
    qsub:"ふだんの感覚に一番近いものを選んでください。",
    questions:VOICE_Q.map((t, i) => ({p:"V", t, rev: i === 11})), render:renderVoice },
  { id:"image", tag:"MINDS EYE", cls:"pink", name:"心のイメージ診断",
    hubDesc:"リンゴを思い浮かべると、写真のように見える人と何も見えない人がいます。心の目の鮮明度を測定。",
    minutes:2, introDesc:"各項目を実際に思い浮かべてみて、その鮮明さを選んでください。12問です。",
    points:["<b>鮮明度％</b>　心のイメージの鮮明さを数値化","<b>タイプ判定</b>　ハイパーフォト型／クリア型／ミスト型／ブラインド型","<b>対象別スコア</b>　人と顔／場所／物／動きで違いが見えます"],
    note:"※ これは障害のチェックではなく、認知の個人差（アファンタジア等）を知るためのものです。",
    parts:{M:"心のイメージについて"},
    options:[["まったく浮かばない",0],["ぼんやり",1],["まあまあ浮かぶ",2],["かなり鮮明",3],["写真のように鮮明",4]],
    qsub:"目を閉じて思い浮かべて、その鮮明さを選んでください。",

/* ================= エンジン ================= */
let cur = null, idx = 0, answers = [];
function showScreen(id){
  ["hub-screen","intro-screen","quiz-screen","result-screen"].forEach(s => $(s).classList.add("hidden"));
  $(id).classList.remove("hidden");
  window.scrollTo({top: 0});
}
function renderHub(){
  $("mod-grid").innerHTML = MODULES.map((m, i) => `
    <button class="mod ${m.cls}" onclick="openIntro(${i})">
      <div class="m-tag">${m.tag}</div>
      <h2>${m.name}</h2>
      <p>${m.hubDesc}</p>
      <div class="m-meta"><span><b>${m.questions.length}問</b></span><span>約${m.minutes}分</span><span>結果はPDF保存可</span></div>
    </button>`).join("");
}
function openIntro(i){
  cur = MODULES[i];
  $("i-tag").textContent = cur.tag;
  $("i-title").textContent = cur.name;
  $("i-desc").textContent = cur.introDesc;
  $("i-points").innerHTML = cur.points.map(p => `<div>${p}</div>`).join("");
  $("i-meta").textContent = `全${cur.questions.length}問 ／ 所要時間は約${cur.minutes}分です。回答データはブラウザの外に送信されません。`;
  $("i-note").textContent = cur.note;
  showScreen("intro-screen");
}
function startModule(){
  answers = new Array(cur.questions.length).fill(null);
  idx = 0;
  showScreen("quiz-screen");
  renderQuestion();
}
function renderQuestion(){
  const q = cur.questions[idx];
  $("q-count").textContent = `質問 ${idx + 1} / ${cur.questions.length}`;
  const pct = Math.round(idx / cur.questions.length * 100);
  $("q-pct").textContent = pct + "%";
  $("q-bar").style.width = pct + "%";
  $("q-chip").textContent = cur.parts[q.p] || "";
  $("q-text").textContent = (cur.qPrefix || "") + q.t + (cur.qSuffix || "");
  $("q-sub").textContent = cur.qsub;
  const box = $("q-opts");
  box.innerHTML = "";
  cur.options.forEach(([label, val]) => {
    const eff = q.rev ? (4 - val) : val;
    const b = document.createElement("button");
    b.className = "opt" + (answers[idx] === eff ? " sel" : "");
    b.innerHTML = `<span>${label}</span><small>${val}</small>`;
    b.onclick = () => {
      answers[idx] = eff;
      renderQuestion();
      setTimeout(() => { if (idx < cur.questions.length - 1){ idx++; renderQuestion(); } else { finishQuiz(); } }, 180);
    };
    box.appendChild(b);
  });
  $("back-btn").disabled = idx === 0;
}
function finishQuiz(){
  $("q-bar").style.width = "100%";
  $("q-pct").textContent = "100%";
  $("result-body").innerHTML = resultShell(cur.render(answers));
  showScreen("result-screen");
}
function goHub(){ showScreen("hub-screen"); }
function retryModule(){ startModule(); }
$("start-btn").onclick = startModule;
$("intro-back").onclick = goHub;
$("back-btn").onclick = () => { if (idx > 0){ idx--; renderQuestion(); } };
$("skip-btn").onclick = () => {
  if (answers[idx] === null) answers[idx] = 0;
  if (idx < cur.questions.length - 1){ idx++; renderQuestion(); } else { finishQuiz(); }
};
renderHub();
</script>
